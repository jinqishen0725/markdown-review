<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pptx-preview Test</title>
<style>
body { font-family: Arial; background: #1e1e1e; color: #ccc; padding: 20px; }
#pptx-wrapper { width: 960px; margin: 0 auto; background: #fff; }
#status { padding: 10px; text-align: center; }
h2 { color: #fff; }
</style>
</head>
<body>
<h2>pptx-preview Test</h2>
<div id="status">Loading...</div>
<div id="pptx-wrapper"></div>

<script src="../media/pptx-preview.js"></script>
<script>
async function run() {
    try {
        document.getElementById('status').textContent = 'Fetching pptx...';
        const resp = await fetch('UMS_Experiment_Proposal.pptx');
        const buffer = await resp.arrayBuffer();
        
        document.getElementById('status').textContent = 'Initializing previewer...';
        var previewer = PptxPreview.init(document.getElementById('pptx-wrapper'), {
            width: 960,
            height: 540,
            mode: 'list'
        });
        
        document.getElementById('status').textContent = 'Rendering...';
        await previewer.preview(buffer);
        
        document.getElementById('status').textContent = 'Done! Slides: ' + previewer.slideCount;
    } catch(e) {
        document.getElementById('status').innerHTML = '<b>Error:</b> ' + e.message + '<pre>' + (e.stack || '') + '</pre>';
        console.error(e);
    }
}
run();
</script>
</body>
</html>
