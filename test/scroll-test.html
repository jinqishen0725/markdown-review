<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PPTX Scroll Test</title>
<script src="/media/pptx-viewer.js"></script>
<style>
body { background: #1e1e1e; color: #ccc; font-family: sans-serif; margin: 0; padding: 20px; }
#slides-output { width: 960px; margin: 0 auto; }
#slides-output > div { margin-bottom: 16px; position: relative; }
.slide-label { font-size: 14px; font-weight: bold; color: #ccc; margin: 16px 0 6px; max-width: 960px; }

/* Comment badge */
#comment-badge { position: fixed; top: 10px; right: 10px; background: #007acc; color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; z-index: 999; }

/* Popover */
#comment-popover { display: none; position: absolute; z-index: 100; background: #252526; border: 1px solid #444; border-radius: 8px; padding: 12px; width: 340px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); max-height: 400px; overflow-y: auto; }
.pop-text { font-size: 13px; margin-bottom: 6px; }
.pop-meta { font-size: 11px; color: #888; margin-bottom: 8px; }
.pop-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pop-actions button { padding: 3px 10px; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; background: #0078D4; color: #fff; }
.pop-reply-input { margin-top: 8px; }
.pop-reply-input textarea { width: 100%; padding: 4px; border: 1px solid #555; background: #3c3c3c; color: #ccc; border-radius: 3px; font-size: 12px; resize: none; box-sizing: border-box; }
.pop-reply-input button { margin-top: 4px; padding: 3px 10px; border: none; background: #333; color: #ccc; border-radius: 3px; cursor: pointer; font-size: 11px; }
.pop-replies { margin: 8px 0; padding-left: 12px; border-left: 2px solid #555; }
.pop-reply { margin-bottom: 6px; }
.pop-reply-text { font-size: 12px; }
.pop-reply-meta { font-size: 10px; color: #888; }

/* Role badges */
.role-badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-right: 4px; font-weight: 600; }
.role-user { background: #0078D4; color: #fff; }
.role-agent { background: #68217A; color: #fff; }
.role-pptx { background: #2196F3; color: #fff; }
.inline-edit-btn, .reply-delete-btn { background: none !important; border: none !important; color: #888 !important; cursor: pointer; font-size: 10px !important; padding: 0 2px !important; }
.btn-copilot { background: #68217A !important; color: #fff; }
.btn-resolve { border-color: #4caf50; }

/* Dialog */
#comment-dialog { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
#comment-dialog.open { display: flex; }
.dlg-box { background: #252526; border: 1px solid #444; border-radius: 8px; padding: 20px; width: 500px; }
.dlg-box h3 { margin: 0 0 8px; color: #ccc; }
.dlg-preview { font-size: 12px; color: #888; margin-bottom: 8px; padding: 6px; background: #2d2d30; border-radius: 4px; }
.dlg-box textarea { width: 100%; min-height: 80px; padding: 8px; border: 1px solid #555; background: #3c3c3c; color: #ccc; border-radius: 4px; font-size: 13px; resize: vertical; box-sizing: border-box; }
.dlg-actions { margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end; }
.dlg-actions button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-primary { background: #0078D4; color: #fff; }
.btn-cancel { background: #3a3d41; color: #ccc; }

/* Sidebar */
#sidebar { position: fixed; top: 0; right: -360px; width: 350px; height: 100vh; background: #252526; border-left: 1px solid #444; z-index: 1000; overflow-y: auto; transition: right 0.2s; padding: 12px; box-sizing: border-box; }
#sidebar.open { right: 0; }
.sidebar-close { position: sticky; top: 0; float: right; background: none; border: none; color: #ccc; font-size: 20px; cursor: pointer; z-index: 1001; }

/* Comment list */
.clist-item { padding: 10px; margin-bottom: 8px; background: #3c3c3c; border-radius: 6px; border-left: 3px solid #007acc; cursor: pointer; }
.clist-item.pptx-comment { border-left-color: #2196F3; }
.clist-item.resolved { opacity: 0.5; border-left-color: #666; }
.item-preview { font-size: 11px; color: #888; margin-bottom: 4px; }
.item-comment { font-size: 13px; margin-bottom: 4px; }
.item-meta { font-size: 11px; color: #888; }
.item-replies { margin-top: 6px; padding-left: 12px; border-left: 2px solid #555; }
.item-reply { margin-bottom: 4px; }
.item-reply-text { font-size: 12px; }
.item-reply-meta { font-size: 10px; color: #888; }
.item-actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.item-actions button, .item-reply-input button { padding: 3px 10px; background: #0078D4; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; }
.panel-filters button { padding: 2px 8px; font-size: 11px; border: 1px solid #555; border-radius: 3px; cursor: pointer; background: transparent; color: #ccc; }
.panel-filters button.active { background: #0078D4; color: #fff; }
.panel-bulk button { padding: 2px 8px; font-size: 11px; border: none; border-radius: 3px; cursor: pointer; background: #0078D4; color: #fff; }

#debug { position: fixed; bottom: 0; left: 0; right: 0; background: #000; color: #0f0; padding: 8px; font-family: monospace; font-size: 11px; z-index: 9999; max-height: 150px; overflow-y: auto; }
</style>
</head>
<body>
<div id="comment-badge" onclick="toggleSidebar()">💬 <span id="badge-count">0</span></div>
<div id="sidebar">
    <button class="sidebar-close" onclick="toggleSidebar()">×</button>
    <h3>💬 Review Comments</h3>
    <div class="panel-toolbar" style="padding:0 0 8px;">
        <input type="text" id="comment-search" placeholder="Search..." oninput="buildList()" style="width:100%;padding:4px 8px;margin-bottom:6px;border:1px solid #555;background:#3c3c3c;color:#ccc;border-radius:3px;font-size:12px;box-sizing:border-box;">
        <div class="panel-filters" style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">
            <button id="filter-all" class="active" onclick="setFilter('all')">All</button>
            <button id="filter-open" onclick="setFilter('open')">Open</button>
            <button id="filter-resolved" onclick="setFilter('resolved')">Resolved</button>
        </div>
    </div>
    <div id="comment-list"></div>
</div>
<div id="comment-dialog"><div class="dlg-box"><h3>Add Comment</h3></div></div>
<div id="comment-popover"></div>
<div id="slides-output"></div>
<div id="debug"></div>
<script>
(function() {
    var vscode = { postMessage: function() {} };
    var comments = [
        { id: 'c1', comment: 'Fix the title text', blockPreview: 'Slide 1 (shapeId=2): "UMS Experiment"', elementId: 'slide_1_shape_2', resolved: false, replies: [], _source: '', role: 'user', timestamp: new Date().toISOString(), blockType: 'slide' },
        { id: 'c2', comment: 'Add more details here', blockPreview: 'Slide 5 (shapeId=3)', elementId: 'slide_5_shape_3', resolved: false, replies: [], _source: '', role: 'user', timestamp: new Date().toISOString(), blockType: 'slide' },
        { id: 'pptx_7', comment: 'Native PPTX comment from Alice', blockPreview: 'Slide 8', elementId: 'slide_8', resolved: false, replies: [], _source: 'pptx', _wordAuthor: 'Alice', role: 'user', timestamp: new Date().toISOString(), blockType: 'slide' },
    ];
    var pendingSlideIndex = null;
    var pendingShapeId = null;
    var pendingShapeName = null;

    function debugLog(msg) {
        console.log('[DEBUG] ' + msg);
        var el = document.getElementById('debug');
        if (el) el.textContent += msg + '\n';
    }

    window.openCommentDialog = function() {};
    window.closeDialog = function() {};
    window.submitComment = function() {};
    window.submitAndAskCopilot = function() {};
    window.savePptx = function() {};

    var __nativePrefix = 'pptx_';
    var __nativeSource = 'pptx';

    // ======== Shared Comment UI (inline for testing) ========
    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
    window.resolveComment = function(id) { vscode.postMessage({ command: 'resolveComment', id: id }); };
    window.unresolveComment = function(id) { vscode.postMessage({ command: 'unresolveComment', id: id }); };
    window.deleteComment = function(id) { vscode.postMessage({ command: 'deleteComment', id: id }); };
    window.submitReply = function(id) {};
    window.submitListReply = function(id) {};
    window.askCopilotThread = function(id) {};
    window.copyComment = function(id) {};
    window.startEditComment = function() {};
    window.saveEditComment = function() {};
    window.cancelEdit = function() {};
    window.startEditReply = function() {};
    window.saveEditReply = function() {};
    window.deleteReply = function() {};
    window.setFilter = function(f) { currentFilter = f; buildList(); };
    window.resolveAll = function() {};
    window.deleteAllResolved = function() {};
    window.sendAllToCopilot = function() {};
    window.copyAllToClipboard = function() {};

    function _isNativeComment(c) { return c._source === __nativeSource && __nativeSource; }
    function _authorBadge(c) {
        if (c._source === 'pptx') return '<span class="role-badge role-pptx">' + esc(c._wordAuthor || 'PPT') + '</span>';
        return '<span class="role-badge role-' + (c.role||'user') + '">' + (c.role||'user') + '</span>';
    }

    function updateBadge() {
        var badge = document.getElementById('comment-badge');
        var span = document.getElementById('badge-count');
        if (!badge || !span) return;
        var unresolved = comments.filter(function(c) { return !c.resolved; });
        badge.style.display = comments.length > 0 ? 'block' : 'none';
        span.textContent = unresolved.length + ' / ' + comments.length;
    }
    window.updateBadge = updateBadge;

    var currentFilter = 'all';
    function buildList() {
        var container = document.getElementById('comment-list-body') || document.getElementById('comment-list');
        if (!container) { debugLog('buildList: no container!'); return; }
        container.innerHTML = '';
        var filtered = comments.filter(function(c) {
            if (currentFilter === 'open' && c.resolved) return false;
            if (currentFilter === 'resolved' && !c.resolved) return false;
            return true;
        });
        debugLog('buildList: ' + filtered.length + ' items, __onListItemClick is ' + typeof __onListItemClick);
        filtered.forEach(function(c) {
            var div = document.createElement('div');
            var isNative = _isNativeComment(c);
            var sourceClass = c._source === 'pptx' ? ' pptx-comment' : '';
            div.className = 'clist-item' + (c.resolved ? ' resolved' : '') + sourceClass;
            var authorBadge = _authorBadge(c);
            div.innerHTML =
                '<div class="item-preview">' + esc(c.blockPreview || '') + '</div>' +
                '<div class="item-comment">' + authorBadge + esc(c.comment) + '</div>' +
                '<div class="item-meta">' + new Date(c.timestamp).toLocaleString() + '</div>' +
                '<div class="item-actions">' +
                '<button onclick="event.stopPropagation();">Resolve</button>' +
                '<button onclick="event.stopPropagation();">Copy</button>' +
                '</div>';

            div.addEventListener('click', function() {
                debugLog('CLICK on item: ' + c.id + ' elementId=' + c.elementId);
                if (typeof __onListItemClick === 'function') {
                    __onListItemClick(c);
                } else {
                    debugLog('__onListItemClick is NOT a function!');
                }
            });
            container.appendChild(div);
        });
    }
    window.buildList = buildList;

    // === PPTX hooks ===
    window.__onListItemClick = function(c) {
        debugLog('__onListItemClick called! elementId=' + c.elementId);
        var match = (c.elementId || '').match(/slide_(\d+)/);
        var slideNum = match ? match[1] : '';
        if (!slideNum) { debugLog('No slideNum!'); return; }
        var labels = output.querySelectorAll('.slide-label');
        debugLog('Looking for "Slide ' + slideNum + '" in ' + labels.length + ' labels');
        for (var j = 0; j < labels.length; j++) {
            if (labels[j].textContent === 'Slide ' + slideNum) {
                labels[j].scrollIntoView({ behavior: 'smooth', block: 'start' });
                debugLog('SCROLLED to Slide ' + slideNum);
                return;
            }
        }
        debugLog('Label NOT FOUND!');
    };
    window.__findAnchorForComment = function() { return null; };
    window.__onCommentChange = function() {};

    var output = document.getElementById('slides-output');

    // Render slides using real pptx-renderer
    debugLog('Fetching PPTX...');
    fetch('/test/UMS_Experiment_Proposal.pptx')
        .then(function(r) { return r.arrayBuffer(); })
        .then(function(buf) {
            debugLog('Rendering...');
            return PptxLib.PptxViewer.open(buf, output, {
                renderMode: 'list',
                listOptions: { windowed: true, batchSize: 4, initialSlides: 3 },
                fitMode: 'contain',
                width: 960,
            });
        })
        .then(function() {
            debugLog('Rendered!');
            setTimeout(function() {
                var slideEls = Array.from(output.children);
                for (var i = slideEls.length - 1; i >= 0; i--) {
                    var slideIdx = i + 1;
                    var label = document.createElement('div');
                    label.className = 'slide-label';
                    label.textContent = 'Slide ' + slideIdx;
                    output.insertBefore(label, slideEls[i]);
                }
                debugLog('Labels added: ' + output.querySelectorAll('.slide-label').length);
                updateBadge();
            }, 500);
        })
        .catch(function(e) { debugLog('ERROR: ' + e.message); });

    var sidebarOpen = false;
    window.toggleSidebar = function() {
        sidebarOpen = !sidebarOpen;
        document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
        if (sidebarOpen) buildList();
        debugLog('Sidebar ' + (sidebarOpen ? 'opened' : 'closed'));
    };

    buildList();
    debugLog('Init done');
})();
</script>
</body>
</html>
