<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Markdown Review</title>
<style>
:root {
    --bg: var(--color-background-primary, #ffffff);
    --surface: var(--color-background-secondary, #f4f6f8);
    --text: var(--color-text-primary, #202124);
    --muted: var(--color-text-secondary, #667085);
    --border: var(--color-border-secondary, #d0d5dd);
    --accent: var(--color-background-info, #146c94);
    --accent-text: var(--color-text-inverse, #ffffff);
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans, "Segoe UI", sans-serif);
    font-size: 13px;
}
header { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
h1 { margin: 0; font-size: 18px; line-height: 1.25; }
#review-summary, #status, .preview, .block-metadata { color: var(--muted); }
#status { min-height: 20px; margin: 8px 0; }
#status.error { color: var(--color-text-danger, #b42318); }
#blocks, #comments { display: grid; gap: 8px; }
.section-heading { margin: 18px 0 8px; font-size: 14px; }
.block-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; }
.block-content { min-width: 0; border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; background: var(--bg); }
.block-metadata { font-size: 11px; margin-bottom: 3px; }
.block-preview { overflow-wrap: anywhere; }
.comment-count { display: inline-block; margin-top: 5px; color: var(--accent); font-size: 11px; }
.comment { border: 1px solid var(--border); border-radius: 6px; padding: 12px; background: var(--bg); }
.comment.resolved { opacity: 0.68; }
.comment-heading { display: flex; justify-content: space-between; gap: 10px; }
.state { font-size: 11px; color: var(--muted); }
.preview { margin-top: 6px; padding-left: 8px; border-left: 3px solid var(--accent); }
.replies { padding: 6px 9px; background: var(--surface); border-radius: 4px; }
.replies p { margin: 3px 0; }
.reply-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-top: 10px; }
textarea { width: 100%; resize: vertical; border: 1px solid var(--border); border-radius: 4px; padding: 6px; background: var(--bg); color: var(--text); font: inherit; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
button { border: 1px solid var(--border); border-radius: 4px; padding: 5px 9px; background: var(--surface); color: var(--text); cursor: pointer; font: inherit; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.add-comment { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: #0078d4; color: #ffffff; font-size: 18px; line-height: 26px; font-weight: 600; }
button.add-comment:hover { background: #106ebe; }
.prompt-fallback { margin-top: 8px; min-height: 100px; }
.empty { text-align: center; color: var(--muted); padding: 24px 0; }
dialog { width: min(480px, calc(100vw - 28px)); border: 1px solid var(--border); border-radius: 6px; padding: 16px; background: var(--bg); color: var(--text); }
dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
dialog h2 { margin: 0 0 8px; font-size: 16px; }
#dialog-preview { margin-bottom: 8px; padding: 7px; border-left: 3px solid var(--accent); color: var(--muted); background: var(--surface); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
@media (max-width: 480px) {
    header, .reply-row { display: grid; grid-template-columns: 1fr; }
    header button { justify-self: start; }
}
</style>
</head>
<body>
<header>
    <div>
        <h1 id="document-title">Markdown Review</h1>
        <div id="review-summary">Waiting for document data...</div>
    </div>
    <button id="refresh" type="button">Refresh</button>
</header>
<div id="status" role="status" aria-live="polite"></div>
<h2 class="section-heading">Document blocks</h2>
<section id="blocks" aria-label="Commentable Markdown blocks"></section>
<h2 class="section-heading">Review comments</h2>
<main id="comments"></main>
<dialog id="comment-dialog">
    <h2>Add review comment</h2>
    <div id="dialog-preview"></div>
    <textarea id="dialog-input" rows="4" placeholder="Write your comment"></textarea>
    <div class="dialog-actions">
        <button id="dialog-cancel" type="button">Cancel</button>
        <button id="dialog-submit" type="button" class="primary">Add comment</button>
    </div>
</dialog>
<script>/*__APP_SCRIPT__*/</script>
</body>
</html>
